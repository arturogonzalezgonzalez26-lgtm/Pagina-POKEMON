<!DOCTYPE html>

<html lang="es">
<!-- Aquí pongo la configuración y los archivos que necesita la página. -->
<head>
    
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>POKESHOP | Catálogo</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <!-- Cargo los estilos de bootstrap para usar sus diseños. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="css/style.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Esta parte contiene la cabecera de la página. -->
  <header>
    
    <nav class="navbar navbar-expand-lg navbar-poke sticky-top" data-bs-theme="dark" aria-label="Navegación principal">
      
      <div class="container">
        
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">

          <img src="img/logo.svg" alt="" width="40" height="40">
          <span>POKESHOP</span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir o cerrar el menú">
          
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Aquí están los enlaces del menú de navegación. -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
          
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="catalogo.html">Catálogo</a></li>
            
            <li class="nav-item"><a class="nav-link" href="producto.html">Producto</a></li>
            
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

<main class="container tienda-main flex-grow-1">

    <section class="presentacion">
        <!-- Este es el título de esta sección. -->
        <h2>Catálogo</h2>
        
        <p>Elige una categoría y encuentra tus favoritos.</p>
    </section>

    <!-- Esta sección muestra los productos de esta categoría. -->
    <section class="productos productos-4" id="productos">

        <article class="tarjeta">
            
            <img src="img/cartapika.jpg" alt="Carta Pikachu">
            
            <h3>Cartas</h3>
            <!-- Este enlace permite ir a otra página o sección. -->
            <a href="cartas.html" class="btn btn-danger">Ver cartas</a>
        </article>

        <article class="tarjeta">
            
            <img src="img/sobre.jpg" alt="Sobre de cartas">
            
            <h3>Cajas y sobres</h3>
            <!-- Este enlace permite ir a otra página o sección. -->
            <a href="cajas.html" class="btn btn-danger">Ver cajas</a>
        </article>

        <article class="tarjeta">
            
            <img src="img/peluchepika.jpg" alt="Peluche Pikachu">
            
            <h3>Peluches</h3>
            <!-- Este enlace permite ir a otra página o sección. -->
            <a href="peluches.html" class="btn btn-danger">Ver peluches</a>
        </article>

        <article class="tarjeta">
            
            <img src="img/videojuego1.jpg" alt="Pokémon Escarlata">
            
            <h3>Videojuegos</h3>
            <!-- Este enlace permite ir a otra página o sección. -->
            <a href="videojuegos.html" class="btn btn-danger">Ver videojuegos</a>
        </article>

    </section>

</main>

  <footer class="footer-poke pt-5 pb-3">
    
    <div class="container">
      
      <p class="mb-0">&copy; POKESHOP</p>
    </div>
  </footer>

  <!-- Cargo javascript de bootstrap para que funcionen sus elementos interactivos. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
